<!doctype html>
<html lang="zh-Hant-TW">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#F4F6F1" />
    <title>茶葉記帳</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@500;600&family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@600;700&display=swap" />
    <script>
      // 先套用這台裝置選的主題（預設淺色），避免畫面先閃一下別的顏色
      var t = "light"; try { if (JSON.parse(localStorage.getItem("tea-theme")) === "dark") t = "dark"; } catch (e) {}
      document.documentElement.dataset.theme = t;
      if (t === "dark") document.querySelector('meta[name="theme-color"]').setAttribute("content", "#111714");
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
